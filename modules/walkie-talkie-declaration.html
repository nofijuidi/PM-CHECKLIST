<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>SPTS - Walkie Talkie Declaration</title>
  <meta name="theme-color" content="#0f172a">

  <!-- Mobile Full-Screen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    /* Top Navigation Header */
    .walkie-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-home-icon {
      width: 40px;
      height: 40px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #002060;
    }

    .walkie-header-title {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 17px;
      font-weight: 800;
      padding: 0 8px;
      text-transform: uppercase;
    }

    .top-right-app-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #cbd5e1;
    }

    /* Form Container */
    .form-embed-container {
      flex: 1;
      width: 100%;
      border: 1.5px solid #0078D4;
      border-radius: 12px;
      overflow: hidden;
      background-color: #f8fafc;
      position: relative;
    }

    .form-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Footer Action */
    .action-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 12px;
    }

    .btn-back-round {
      width: 46px;
      height: 46px;
      border: 2px solid #0078D4;
      border-radius: 50%;
      background: white;
      color: #0078D4;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="view-screen">
      
      <!-- Top Navigation -->
      <div class="walkie-top-nav">
        <div class="btn-home-icon" onclick="goHome()" title="Go to Home Page">🏠</div>
        <div class="walkie-header-title">WALKIE TALKIE DECLARATION</div>
        <img src="../icon-192.png" alt="App Icon" class="top-right-app-icon" onerror="this.style.display='none'" />
      </div>

      <!-- Embedded Microsoft Form Box -->
      <div class="form-embed-container">
        <iframe 
          class="form-iframe" 
          src="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=7sx9IhhCH0GR502r3fD1-LijVqaNChJMnVlZ6TJ6gQ1UM05WODU2UEZVVzdDVDVKMFFJMVhFQk45UiQlQCN0PWcu&embed=true" 
          allowfullscreen 
          webkitallowfullscreen 
          mozallowfullscreen 
          msallowfullscreen>
        </iframe>
      </div>

      <!-- Action Footer -->
      <div class="action-row">
        <div class="btn-back-round" onclick="goHome()">➔</div>
      </div>

    </div>
  </div>

  <script>
    function checkSession() {
      const activeSession = sessionStorage.getItem('userSession');
      if (!activeSession) {
        window.location.href = '../index.html';
      }
    }

    function goHome() {
      window.location.href = '../index.html';
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkSession();
    });
  </script>

  <!-- Global Full-Screen / Silent Controls Trigger -->
  <script src="../js/fullscreen-global.js"></script>
</body>
</html>
