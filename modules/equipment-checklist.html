<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPTS - Equipment Checklist</title>
  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      
      /* Disable contextual search & long-press popups */
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    /* Top Animated Status Banner (#1) */
    .top-status-banner {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
      display: none;
      transition: all 0.3s ease;
      z-index: 50;
    }
    .status-info { background-color: #0284c7; display: block; }
    .status-success { background-color: #16a34a; display: block; }
    .status-error { background-color: #dc2626; display: block; }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }

    /* Enlarged Clock Header (#4) */
    .booking-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-home-icon {
      width: 40px;
      height: 40px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #002060;
    }

    .header-clock-display {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
      display: block;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      background-color: #f8fafc;
      outline: none;

      /* Allow input typing */
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    .form-control:focus {
      border-color: #0078D4;
      background-color: #ffffff;
    }

    /* Action Buttons Row (#6) */
    .btn-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-refresh { background-color: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .btn-clear { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .btn-submit { background-color: #0078D4; color: #ffffff; }

    /* Modal Pop-up (#7) */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-header {
      font-size: 15px;
      font-weight: 800;
      color: #002060;
      margin-bottom: 8px;
    }

    .modal-declaration-text {
      font-size: 12px;
      color: #334155;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      line-height: 1.4;
      font-weight: 600;
      white-space: pre-wrap;
    }

    .action-checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      background: #fafafa;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .checkbox-label {
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-label input {
      width: 16px;
      height: 16px;
      accent-color: #0078D4;
    }

    .modal-btn-row {
      display: flex;
      gap: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- Top Status Banner (#1) -->
    <div id="topStatusBanner" class="top-status-banner"></div>

    <div class="view-screen">
      
      <!-- Top Navigation & Live Clock Header (#4) -->
      <div class="booking-top-nav">
        <div class="btn-home-icon" onclick="goHome()">🏠</div>
        <div id="liveClockDisplay" class="header-clock-display">--/--/---- 00:00:00ss</div>
      </div>

      <!-- Staff Details Field (#3) -->
      <div class="form-group">
        <label class="form-label">Declared By (Staff ID & Name)</label>
        <input type="text" id="staffInput" class="form-control" readonly />
      </div>

      <!-- Select Equipment -->
      <div class="form-group">
        <label class="form-label">Select Equipment</label>
        <select id="selectEquipment" class="form-control">
          <option value="">-- Choose Equipment --</option>
          <option value="TC03">TC03</option>
          <option value="TC04">TC04</option>
          <option value="RS01">RS01</option>
        </select>
      </div>

      <!-- Equipment Number -->
      <div class="form-group">
        <label class="form-label">Equipment Number</label>
        <input type="text" id="equipmentNumber" class="form-control" placeholder="e.g. EQ-9002" />
      </div>

      <!-- Select Issue with Multi-Word Search Filter (#5) -->
      <div class="form-group">
        <label class="form-label">Select Issue (Type multiple keywords)</label>
        <input type="text" id="selectIssueSearch" class="form-control" placeholder="e.g. Aircond Swing Tidak Berfungsi" oninput="filterIssueList()" />
        <select id="selectIssueDropdown" class="form-control" style="margin-top: 4px;" size="4" onchange="syncSelectedIssue()">
          <option value="Aircond - Swing Tidak Berfungsi">Aircond - Swing Tidak Berfungsi</option>
          <option value="Aircond - Tidak Sejuk">Aircond - Tidak Sejuk</option>
          <option value="Engine - Leaking Oil">Engine - Leaking Oil</option>
          <option value="Brake - Low Pressure">Brake - Low Pressure</option>
        </select>
      </div>

      <!-- Toolbar Buttons: Refresh & Clear (#6) -->
      <div class="btn-toolbar">
        <button class="btn-action btn-refresh" onclick="refreshForm()">🔄 REFRESH</button>
        <button class="btn-action btn-clear" onclick="clearSelectedFields()">🧹 CLEAR</button>
      </div>

      <!-- Submit Button -->
      <button class="btn-action btn-submit" style="width: 100%; padding: 12px;" onclick="openConfirmationModal()">SUBMIT ISSUE</button>

    </div>

    <!-- Confirmation Pop-up Modal (#7) -->
    <div id="confirmModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">Confirm Declaration</div>
        
        <div id="modalDeclarationText" class="modal-declaration-text"></div>

        <div class="form-label" style="margin-bottom: 6px;">Select Action(s):</div>
        <div class="action-checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" class="action-chk" value="Sent to Workshop"> Sent to Workshop
          </label>
          <label class="checkbox-label">
            <input type="checkbox" class="action-chk" value="Continue with Issue"> Continue with Issue
          </label>
          <label class="checkbox-label">
            <input type="checkbox" class="action-chk" value="Change Equipment"> Change Equipment
          </label>
        </div>

        <div class="modal-btn-row">
          <button class="btn-action btn-clear" style="flex:1;" onclick="closeModal()">Cancel</button>
          <button class="btn-action btn-submit" style="flex:1;" onclick="submitFinalLog()">CONFIRM</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUBMIT_LOG_FLOW_URL = "https://default227dccee4218411f91e74dabddf0f5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/0ec41aab7114455687c2ce778f4c9459/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=yzAu6ONVD7_Rm01FBxTuj4QLPcJZ4-9QD-aCXAPhnh0";

    let currentUser = { staffId: "EMP-1042", name: "NOFIJUIDI" };

    // Live Clock with Seconds Ticker (#4)
    function startLiveClock() {
      const clockEl = document.getElementById('liveClockDisplay');
      setInterval(() => {
        const now = new Date();
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        clockEl.innerText = `${dd}/${mm}/${yyyy}   ${hh}:${min}:${ss}ss`;
      }, 1000);
    }

    // Top Status Banner Helper (#1)
    function showTopBanner(message, type = 'info') {
      const banner = document.getElementById('topStatusBanner');
      banner.className = `top-status-banner status-${type}`;
      banner.innerText = message;
      setTimeout(() => {
        banner.className = 'top-status-banner';
      }, 4000);
    }

    function goHome() {
      window.location.href = '../index.html';
    }

    // Multi-Word Search Filter (#5)
    function filterIssueList() {
      const input = document.getElementById('selectIssueSearch').value.toLowerCase().trim();
      const keywords = input.split(' ').filter(k => k.length > 0);
      const dropdown = document.getElementById('selectIssueDropdown');
      const options = dropdown.options;

      for (let i = 0; i < options.length; i++) {
        const text = options[i].value.toLowerCase();
        const matchesAll = keywords.every(kw => text.includes(kw));
        options[i].style.display = matchesAll ? '' : 'none';
      }
    }

    function syncSelectedIssue() {
      const dropdown = document.getElementById('selectIssueDropdown');
      if (dropdown.value) {
        document.getElementById('selectIssueSearch').value = dropdown.value;
      }
    }

    // CLEAR Button Handler (#6)
    function clearSelectedFields() {
      document.getElementById('selectEquipment').value = '';
      document.getElementById('equipmentNumber').value = '';
      document.getElementById('selectIssueSearch').value = '';
      document.getElementById('selectIssueDropdown').selectedIndex = -1;
      filterIssueList();
      showTopBanner('Fields cleared', 'info');
    }

    function refreshForm() {
      fetchTodayState();
      showTopBanner('Form refreshed', 'info');
    }

    // Confirmation Modal Formatting (#3 & #7)
    function openConfirmationModal() {
      const equip = document.getElementById('selectEquipment').value;
      const issue = document.getElementById('selectIssueSearch').value || document.getElementById('selectIssueDropdown').value;

      if (!equip || !issue) {
        showTopBanner('Please select Equipment and Issue first', 'error');
        return;
      }

      const now = new Date();
      const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth()+1).padStart(2, '0')}/${now.getFullYear()}`;

      // Insert Staff ID before Name (#3)
      const modalText = `Dear ${currentUser.staffId} ${currentUser.name}\n\nYou are declaring ${equip}\n${issue}\n\nOn ${dateStr}`;
      
      document.getElementById('modalDeclarationText').innerText = modalText;
      
      // Uncheck action checkboxes
      document.querySelectorAll('.action-chk').forEach(c => c.checked = false);
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('confirmModal').classList.add('hidden');
    }

    // Submit Final Payload to Power Automate
    async function submitFinalLog() {
      const selectedActions = Array.from(document.querySelectorAll('.action-chk:checked'))
                                  .map(c => c.value)
                                  .join(', ');

      const payload = {
        staffId: currentUser.staffId,
        staffName: currentUser.name,
        equipment: document.getElementById('selectEquipment').value,
        equipmentNumber: document.getElementById('equipmentNumber').value,
        issue: document.getElementById('selectIssueSearch').value || document.getElementById('selectIssueDropdown').value,
        action: selectedActions, // Comma-separated value for INSPECTIONLOG column "ACTION"
        timestamp: new Date().toISOString()
      };

      closeModal();
      showTopBanner('Submitting inspection log...', 'info');

      try {
        const response = await fetch(SUBMIT_LOG_FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          showTopBanner('Submission sent successfully!', 'success');
          
          // Retain Select Equipment & Equipment Number values (#2)
          document.getElementById('selectIssueSearch').value = '';
          document.getElementById('selectIssueDropdown').selectedIndex = -1;
        } else {
          showTopBanner('Failed to submit log to server', 'error');
        }
      } catch (err) {
        showTopBanner('Network error on submission', 'error');
      }
    }

    function fetchTodayState() {
      // Set Staff ID before Name (#3)
      document.getElementById('staffInput').value = `${currentUser.staffId} - ${currentUser.name}`;
    }

    // Prevent context menu (long-press searches)
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('DOMContentLoaded', () => {
      startLiveClock();
      fetchTodayState();
    });
  </script>
</body>
</html>
