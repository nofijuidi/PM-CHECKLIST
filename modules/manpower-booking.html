<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPTS - Manpower Booking</title>
  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      
      /* Disable text selection & touch context popups */
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
      transition: all 0.3s ease;
    }

    /* Outer Wrapper - Default Portrait Dimensions */
    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      transition: padding 0.3s ease;
    }

    /* Top Navigation Header */
    .booking-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-home-icon {
      width: 40px;
      height: 40px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #002060;
    }

    .booking-header-title {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 18px;
      font-weight: 800;
      padding: 0 8px;
    }

    /* Today's Date Banner */
    .today-banner {
      width: 100%;
      background-color: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      color: #002060;
      font-weight: 800;
      font-size: 14px;
    }

    /* Dynamic File Selector Cards */
    .file-list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .file-card {
      width: 100%;
      background-color: #f8fafc;
      border: 1.5px solid #0078D4;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #0078D4;
      font-weight: 700;
      font-size: 13px;
    }

    .file-card.active {
      background-color: #0078D4;
      color: #ffffff;
      border-color: #005a9e;
    }

    .file-card-info {
      display: flex;
      align-items: center;
      gap: 10px;
      word-break: break-all;
    }

    .file-card-arrow {
      font-size: 15px;
      font-weight: 800;
    }

    /* Embedded PDF Document Viewer Box */
    .pdf-viewer-container {
      flex: 1;
      width: 100%;
      min-height: 480px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
      background-color: #f1f5f9;
      position: relative;
      transition: all 0.3s ease;
    }

    .pdf-viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .action-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .btn-next-round {
      width: 48px;
      height: 48px;
      border: 2px solid #0078D4;
      border-radius: 50%;
      background: white;
      color: #0078D4;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* =========================================================
       DYNAMIC LANDSCAPE ORIENTATION (JS FALLBACK CLASSES)
       ========================================================= */
    body.is-landscape .booking-top-nav, 
    body.is-landscape .today-banner, 
    body.is-landscape .file-list-container, 
    body.is-landscape .action-footer { 
      display: none !important; 
    }

    body.is-landscape .app-viewport { 
      max-width: 100vw !important; 
      max-height: 100vh !important; 
      width: 100vw !important; 
      height: 100vh !important; 
      border-radius: 0 !important; 
      margin: 0 !important; 
      padding: 0 !important; 
    }

    body.is-landscape .view-screen { 
      padding: 0 !important; 
    }

    body.is-landscape .pdf-viewer-container { 
      width: 100vw !important; 
      height: 100vh !important; 
      min-height: 100vh !important; 
      border: none !important; 
      border-radius: 0 !important; 
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="view-screen">
      
      <!-- Top Navigation -->
      <div class="booking-top-nav">
        <div class="btn-home-icon" onclick="goHome()">🏠</div>
        <div class="booking-header-title">MANPOWER BOOKING</div>
      </div>

      <!-- Today's Date Banner -->
      <div class="today-banner">
        <span>📅 Today's Bookings</span>
        <span id="displayDateStr">11/08/2026</span>
      </div>

      <!-- File List Container -->
      <div id="fileListContainer" class="file-list-container">
        <!-- JS Renders cards here -->
      </div>

      <!-- Embedded PDF Viewer -->
      <div class="pdf-viewer-container">
        <iframe id="pdfViewerFrame" class="pdf-viewer-frame" 
                src="" title="Manpower Booking Viewer"
                allow="autoplay"></iframe>
      </div>

      <!-- Bottom Navigation Footer -->
      <div class="action-footer">
        <div class="btn-next-round" onclick="goHome()">➔</div>
      </div>

    </div>
  </div>

  <script>
    // Configured with your verified Google Drive File ID
    const BOOKING_FILES = [
      {
        id: "FILE_001",
        name: "11 AUG 2026 BOOKING GROUP.pdf",
        embedUrl: "https://drive.google.com/file/d/1yCu2RUrz6olE1Bi7NVCXXBtTEazxRnP2/preview"
      }
    ];

    let currentActiveIndex = 0;

    function goHome() { 
      window.location.href = '../index.html'; 
    }

    function setLiveDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      document.getElementById('displayDateStr').innerText = `${dd}/${mm}/${yyyy}`;
    }

    function renderFileCards() {
      const container = document.getElementById('fileListContainer');
      container.innerHTML = '';

      if (BOOKING_FILES.length === 0) {
        container.innerHTML = '<div class="file-card">No files available for today.</div>';
        return;
      }

      BOOKING_FILES.forEach((file, index) => {
        const card = document.createElement('div');
        card.className = `file-card ${index === currentActiveIndex ? 'active' : ''}`;
        card.onclick = () => switchPdfFile(index);

        card.innerHTML = `
          <div class="file-card-info">
            <span>📄</span>
            <span>${file.name}</span>
          </div>
          <span class="file-card-arrow">➔</span>
        `;
        container.appendChild(card);
      });
    }

    function switchPdfFile(index) {
      if (index >= 0 && index < BOOKING_FILES.length) {
        currentActiveIndex = index;
        const selectedFile = BOOKING_FILES[index];
        const frame = document.getElementById('pdfViewerFrame');
        
        // Load PDF inside iframe
        frame.src = selectedFile.embedUrl;
        
        // Refresh active card styling
        renderFileCards();
      }
    }

    // ==========================================
    // ORIENTATION DETECTION LOGIC
    // ==========================================
    function handleOrientationChange() {
      // Check if landscape via matchMedia or window.orientation
      const isLandscape = window.matchMedia("(orientation: landscape)").matches || Math.abs(window.orientation) === 90;
      
      if (isLandscape) {
        document.body.classList.add('is-landscape');
      } else {
        document.body.classList.remove('is-landscape');
      }
    }

    // Listen for device rotation and resize events
    window.addEventListener("orientationchange", handleOrientationChange);
    window.addEventListener("resize", handleOrientationChange);

    // Disable default browser context menus
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('DOMContentLoaded', () => {
      setLiveDate();
      renderFileCards();
      
      // Auto-load document
      if (BOOKING_FILES.length > 0) {
        switchPdfFile(0);
      }

      // Run orientation check on initial load
      handleOrientationChange();
    });
  </script>
</body>
</html>
