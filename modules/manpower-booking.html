<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPTS - Manpower Booking</title>
  <meta name="theme-color" content="#0f172a">

  <!-- PDF.js Engine for cross-platform mobile rendering (Android & iOS Safari) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    /* Top Navigation Header */
    .booking-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-home-icon {
      width: 40px;
      height: 40px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #002060;
    }

    .booking-header-title {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 18px;
      font-weight: 800;
    }

    /* Date Status Bar */
    .filter-info-bar {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* File Selection Cards List */
    .file-list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      max-height: 120px;
      overflow-y: auto;
    }

    .file-card {
      background-color: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .file-card.active {
      border-color: #0078D4;
      background-color: #f0f7ff;
      color: #0078D4;
    }

    /* Cross-Platform PDF Viewer Box */
    .pdf-card-container {
      flex: 1;
      width: 100%;
      border: 1.5px solid #0078D4;
      border-radius: 12px;
      overflow-y: auto;
      background-color: #525659;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      position: relative;
    }

    canvas.pdf-page-canvas {
      width: 96% !important;
      height: auto !important;
      margin-bottom: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      background-color: #ffffff;
    }

    .pdf-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #ffffff;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 12px;
    }

    .btn-back-round {
      width: 46px;
      height: 46px;
      border: 2px solid #0078D4;
      border-radius: 50%;
      background: white;
      color: #0078D4;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="view-screen">
      
      <!-- Top Navigation -->
      <div class="booking-top-nav">
        <div class="btn-home-icon" onclick="goHome()">🏠</div>
        <div class="booking-header-title">MANPOWER BOOKING</div>
      </div>

      <!-- Date Banner -->
      <div class="filter-info-bar">
        <span>📅 Today's Bookings</span>
        <span id="currentDateDisplay">--/--/----</span>
      </div>

      <!-- File List Container -->
      <div id="fileListContainer" class="file-list-container">
        <div class="file-card">Connecting to booking server...</div>
      </div>

      <!-- PDF Canvas Viewport -->
      <div class="pdf-card-container" id="pdfCanvasViewer">
        <div id="pdfPlaceholder" class="pdf-placeholder">
          📄 Select a booking document above to view content.
        </div>
      </div>

      <!-- Footer Action -->
      <div class="action-row">
        <div class="btn-back-round" onclick="goHome()">➔</div>
      </div>

    </div>
  </div>

  <script>
    // Point PDF.js worker to CDN
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const GET_BOOKING_FILES_FLOW_URL = "https://default227dccee4218411f91e74dabddf0f5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/0ec41aab7114455687c2ce778f4c9459/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=yzAu6ONVD7_Rm01FBxTuj4QLPcJZ4-9QD-aCXAPhnh0";

    function checkSession() {
      const activeSession = sessionStorage.getItem('userSession');
      if (!activeSession) {
        window.location.href = '../index.html';
      }
    }

    function goHome() {
      window.location.href = '../index.html';
    }

    function getDateParams() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      return { dayNum: dd, monthNum: mm, formattedDisplay: `${dd}/${mm}/${yyyy}` };
    }

    async function fetchTodayBookings() {
      const dateInfo = getDateParams();
      document.getElementById('currentDateDisplay').innerText = dateInfo.formattedDisplay;
      const container = document.getElementById('fileListContainer');

      try {
        const response = await fetch(GET_BOOKING_FILES_FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ monthNum: dateInfo.monthNum, dayNum: dateInfo.dayNum })
        });

        if (response.ok) {
          const result = await response.json();
          renderFileList(result, dateInfo);
        } else {
          container.innerHTML = `<div class="file-card" style="color: #dc2626;">Flow Error (${response.status}).</div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="file-card" style="color: #dc2626;">Network connection failed.</div>`;
      }
    }

    function renderFileList(result, dateInfo) {
      const container = document.getElementById('fileListContainer');
      container.innerHTML = '';

      const files = Array.isArray(result) ? result : [result];

      if (!files || files.length === 0 || !files[0]) {
        container.innerHTML = `<div class="file-card" style="color: #64748b;">No booking files found for ${dateInfo.formattedDisplay}.</div>`;
        return;
      }

      files.forEach((file, index) => {
        const fileName = file.fileName || file.Name || file.DisplayName || 'Booking Document';
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `<span>📄 ${fileName}</span> <span>➔</span>`;

        card.onclick = () => {
          document.querySelectorAll('.file-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          
          if (file.pdfBase64) {
            renderPdfWithPdfJs(file.pdfBase64);
          }
        };

        container.appendChild(card);
        if (index === 0) card.click();
      });
    }

    // Renders PDF directly onto native HTML5 Canvas elements (Works on Android Chrome & Safari)
    async function renderPdfWithPdfJs(base64Data) {
      const container = document.getElementById('pdfCanvasViewer');
      container.innerHTML = '<div style="color: white; padding: 20px;">Rendering document...</div>';

      try {
        // Clean up base64 string if data URI header exists
        const cleanBase64 = base64Data.replace(/^data:application\/pdf;base64,/, "");
        const rawBinary = atob(cleanBase64);
        
        const loadingTask = pdfjsLib.getDocument({ data: rawBinary });
        const pdf = await loadingTask.promise;

        container.innerHTML = ''; // Clear loading indicator

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });

          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page-canvas';
          const context = canvas.getContext('2d');
          
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          container.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        }
      } catch (err) {
        console.error('PDF.js Error:', err);
        container.innerHTML = `<div style="color: #ef4444; padding: 20px;">Failed to render document inside app container.</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkSession();
      fetchTodayBookings();
    });
  </script>
</body>
</html>
