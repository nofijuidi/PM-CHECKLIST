<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPTS - Manpower Booking</title>
  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      
      /* Disable touch callouts and context menu text popups */
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }

    /* Top Navigation Header */
    .booking-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-home-icon {
      width: 40px;
      height: 40px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #002060;
    }

    .booking-header-title {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 18px;
      font-weight: 800;
      padding: 0 8px;
    }

    .top-right-app-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #cbd5e1;
    }

    /* Today's Bookings Header Banner */
    .today-banner {
      width: 100%;
      background-color: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #002060;
      font-weight: 800;
      font-size: 14px;
    }

    /* Stacked Document Cards Container */
    .file-list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* Card Box matching your screenshot style */
    .file-card {
      width: 100%;
      background-color: #f8fafc;
      border: 1.5px solid #0078D4;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #0078D4;
      font-weight: 700;
      font-size: 13px;
    }

    .file-card.active {
      background-color: #0078D4;
      color: #ffffff;
      border-color: #005a9e;
    }

    .file-card-info {
      display: flex;
      align-items: center;
      gap: 10px;
      word-break: break-all;
    }

    .file-card-arrow {
      font-size: 15px;
      font-weight: 800;
    }

    /* PDF Viewer Frame Box */
    .pdf-viewer-container {
      flex: 1;
      width: 100%;
      min-height: 460px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
      background-color: #f1f5f9;
      position: relative;
    }

    .pdf-viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .action-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .btn-next-round {
      width: 48px;
      height: 48px;
      border: 2px solid #0078D4;
      border-radius: 50%;
      background: white;
      color: #0078D4;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="view-screen">
      
      <!-- Top Navigation -->
      <div class="booking-top-nav">
        <div class="btn-home-icon" onclick="goHome()" title="Go to Home Page">🏠</div>
        <div class="booking-header-title">MANPOWER BOOKING</div>
        <img src="../icon-192.png" alt="App Icon" class="top-right-app-icon" onerror="this.style.display='none'" />
      </div>

      <!-- Today's Bookings Header Banner -->
      <div class="today-banner">
        <span>📅 Today's Bookings</span>
        <span id="displayDateStr">11/08/2026</span>
      </div>

      <!-- List of Files stacked beneath Today's Bookings -->
      <div id="fileListContainer" class="file-list-container">
        <!-- Rendered dynamically by JavaScript -->
      </div>

      <!-- PDF Viewer Box -->
      <div class="pdf-viewer-container">
        <iframe id="pdfViewerFrame" class="pdf-viewer-frame" src="" title="Manpower Booking Viewer"></iframe>
      </div>

      <!-- Action Footer -->
      <div class="action-footer">
        <div class="btn-next-round" onclick="goHome()">➔</div>
      </div>

    </div>
  </div>

  <script>
    // List of available files for today. 
    // The LAST item in the array is treated as the LATEST document and opened by default.
    const BOOKING_FILES = [
      {
        id: "FILE_001",
        name: "11 AUG 2026 BOOKING GROUP.pdf",
        embedUrl: "https://drive.google.com/file/d/13bPq-SOX0REDTMGFG5w7h97Oq_H4Ep8b/preview"
      },
      {
        id: "FILE_002",
        name: "11 AUG 2026 EXTRA BOOKING.pdf",
        embedUrl: "https://drive.google.com/file/d/13bPq-SOX0REDTMGFG5w7h97Oq_H4Ep8b/preview"
      }
    ];

    // Set default active index to the latest file (last array item)
    let currentActiveIndex = BOOKING_FILES.length > 0 ? BOOKING_FILES.length - 1 : 0;

    function goHome() {
      window.location.href = '../index.html';
    }

    function setLiveDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      document.getElementById('displayDateStr').innerText = `${dd}/${mm}/${yyyy}`;
    }

    function renderFileCards() {
      const container = document.getElementById('fileListContainer');
      container.innerHTML = '';

      BOOKING_FILES.forEach((file, index) => {
        const card = document.createElement('div');
        card.className = `file-card ${index === currentActiveIndex ? 'active' : ''}`;
        card.onclick = () => switchPdfFile(index);

        card.innerHTML = `
          <div class="file-card-info">
            <span>📄</span>
            <span>${file.name}</span>
          </div>
          <span class="file-card-arrow">➔</span>
        `;

        container.appendChild(card);
      });
    }

    function switchPdfFile(index) {
      if (index >= 0 && index < BOOKING_FILES.length) {
        currentActiveIndex = index;
        const selectedFile = BOOKING_FILES[index];
        
        // Update PDF iframe source
        document.getElementById('pdfViewerFrame').src = selectedFile.embedUrl;
        
        // Re-render card highlights
        renderFileCards();
      }
    }

    // Suppress native touch context menus
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('DOMContentLoaded', () => {
      setLiveDate();
      renderFileCards();
      
      // Auto-load the latest file on startup
      if (BOOKING_FILES.length > 0) {
        switchPdfFile(currentActiveIndex);
      }
    });
  </script>
</body>
</html>
