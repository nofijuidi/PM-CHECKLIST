<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>SPTS - Manpower Booking</title>
  <meta name="theme-color" content="#0f172a">

  <!-- Mobile Full-Screen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;

      /* Device safe area padding */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    /* Top Navigation Header */
    .booking-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-home-icon {
      width: 40px;
      height: 40px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #002060;
    }

    .booking-header-title {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 18px;
      font-weight: 800;
    }

    /* Date Status Bar */
    .filter-info-bar {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Document Header Display */
    .file-list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .file-card {
      background-color: #0078D4;
      border: 1.5px solid #005a9e;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* PDF Viewport Frame */
    .pdf-card-container {
      flex: 1;
      width: 100%;
      border: 1.5px solid #0078D4;
      border-radius: 12px;
      overflow: hidden;
      background-color: #525659;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .gdrive-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #525659;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 12px;
    }

    .btn-back-round {
      width: 46px;
      height: 46px;
      border: 2px solid #0078D4;
      border-radius: 50%;
      background: white;
      color: #0078D4;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="view-screen">
      
      <!-- Top Navigation -->
      <div class="booking-top-nav">
        <div class="btn-home-icon" onclick="goHome()">🏠</div>
        <div class="booking-header-title">MANPOWER BOOKING</div>
      </div>

      <!-- Date Banner -->
      <div class="filter-info-bar">
        <span>📅 Today's Bookings</span>
        <span id="currentDateDisplay">--/--/----</span>
      </div>

      <!-- Single File Indicator Card -->
      <div id="fileListContainer" class="file-list-container">
        <div class="file-card" id="fileNameCard"><span>📄 Daily Booking Document</span> <span>➔</span></div>
      </div>

      <!-- Main Viewer Area -->
      <div class="pdf-card-container" id="pdfCardBox">
        <div class="iframe-wrapper">
          <iframe 
            class="gdrive-iframe" 
            src="https://drive.google.com/embeddedfolderview?id=13bPq-SOX0REDTMGFG5w7h97Oq_H4Ep8b#grid">
          </iframe>
        </div>
      </div>

      <!-- Footer Action -->
      <div class="action-row">
        <div class="btn-back-round" onclick="goHome()">➔</div>
      </div>

    </div>
  </div>

  <script>
    function checkSession() {
      const activeSession = sessionStorage.getItem('userSession');
      if (!activeSession) {
        window.location.href = '../index.html';
      }
    }

    function goHome() {
      window.location.href = '../index.html';
    }

    function setTodayDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      document.getElementById('currentDateDisplay').innerText = `${dd}/${mm}/${yyyy}`;
      document.getElementById('fileNameCard').innerHTML = `<span>📄 Daily Booking Document (${dd}/${mm}/${yyyy})</span> <span>➔</span>`;
    }

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('DOMContentLoaded', () => {
      checkSession();
      setTodayDate();
    });
  </script>

  <!-- Global Full-Screen Trigger -->
  <script src="../js/fullscreen-global.js"></script>
</body>
</html>
