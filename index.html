<!-- 1. Select Equipment Input -->
<div class="form-group">
  <label class="form-label">Select Equipment</label>
  <input 
    list="equipmentOptions" 
    id="selectEquipment" 
    class="form-input" 
    placeholder="Type or select equipment..."
    autocomplete="off"
    onfocus="this.value=''"
    oninput="handleEquipmentChange(this.value)"
  />
  <datalist id="equipmentOptions">
    <option value="CONVEYOR">CONVEYOR</option>
    <option value="CRS">CRS</option>
    <option value="ECH">ECH</option>
    <option value="FORKLIFT">FORKLIFT</option>
    <option value="PM">PM</option>
    <option value="QC">QC</option>
    <option value="RECLAIMER">RECLAIMER</option>
    <option value="RTG">RTG</option>
    <option value="SHIPLOADER">SHIPLOADER</option>
    <option value="SHOVEL">SHOVEL</option>
    <option value="STACKER">STACKER</option>
    <option value="TIPPER">TIPPER</option>
    <option value="TRAILER">TRAILER</option>
  </datalist>
</div>

<!-- 2. Select Equipment Number Input -->
<div class="form-group">
  <label class="form-label">Select Equipment Number</label>
  <input 
    list="equipmentNoOptions" 
    id="selectEquipmentNo" 
    class="form-input" 
    placeholder="Type or select number..."
    autocomplete="off"
    oninput="handleEquipmentNoChange(this.value)"
  />
  <datalist id="equipmentNoOptions"></datalist>
</div>

<!-- 3. Select Issue Input -->
<div class="form-group">
  <label class="form-label">Select Issue</label>
  <input 
    list="issueOptions" 
    id="selectIssue" 
    class="form-input" 
    placeholder="Type or select issue..."
    autocomplete="off"
  />
  <datalist id="issueOptions"></datalist>
</div>
