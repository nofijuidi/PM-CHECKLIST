<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Equipment Portal</title>

  <!-- Web App Fullscreen Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="Equipment Portal">
  <meta name="apple-mobile-web-app-title" content="Equipment Portal">
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 20px;
      overflow-y: auto;
    }

    .hidden {
      display: none !important;
    }

    /* Branding */
    .brand-section {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 28px;
    }

    .brand-logo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #0078D4, #005A9E);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 10px 15px -3px rgba(0, 120, 212, 0.3);
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    /* Navigation Header */
    .inspection-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      position: relative;
    }

    .btn-home-icon {
      width: 38px;
      height: 38px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: #002060;
      transition: background-color 0.2s ease;
    }

    .btn-home-icon:active {
      background-color: #e2e8f0;
      transform: scale(0.95);
    }

    .inspection-header-title {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-right: 38px;
    }

    /* Banner Bar */
    .banner-bar {
      display: flex;
      width: 100%;
      height: 34px;
      border-radius: 6px;
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .shift-day {
      background-color: #FFD700 !important;
      color: #000000 !important;
    }

    .shift-night {
      background-color: #002060 !important;
      color: #ffffff !important;
    }

    .banner-shift {
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-weight: 800;
    }

    .banner-date {
      background-color: #1f6bc6;
      color: white;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-info-banner {
      color: #002060;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1.5px solid #0078D4;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
      color: #333;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: #005A9E;
      box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.2);
    }

    .form-textarea {
      height: 80px;
      resize: none;
    }

    /* Grid Pill Box Layout */
    .grid-container-eq {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 6px;
      margin-top: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding: 2px;
    }

    .grid-container-num {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 6px;
      margin-top: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding: 2px;
    }

    .grid-container-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding: 2px;
    }

    .grid-box {
      background-color: #3b62b0;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 8px 4px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      border: 1px solid #2d4e93;
      transition: all 0.15s ease;
      word-break: break-word;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }

    .grid-box-list {
      background-color: #3b62b0;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #2d4e93;
      transition: all 0.15s ease;
    }

    .grid-box:active, .grid-box-list:active,
    .grid-box.selected, .grid-box-list.selected {
      background-color: #1d4ed8;
      border-color: #0f172a;
      box-shadow: inset 0 0 0 2px #ffffff;
      transform: scale(0.98);
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      height: 48px;
      background-color: #0078D4;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary:hover {
      background-color: #005A9E;
    }

    .btn-primary:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .alert-error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }

    /* Profile Card */
    .user-card {
      background: #f1f5f9;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .user-name {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background-color: #e2e8f0;
      color: #334155;
    }

    .badge-highlight {
      background-color: #0078D4 !important;
      color: #ffffff !important;
    }

    .nav-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 14px;
    }

    .nav-card:hover {
      border-color: #0078D4;
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 120, 212, 0.15);
    }

    .nav-card-icon {
      width: 44px;
      height: 44px;
      background: #eff6ff;
      color: #0078D4;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .nav-card-title {
      font-weight: 700;
      font-size: 16px;
      color: #0f172a;
    }

    .nav-card-sub {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .action-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }

    .btn-submit-inspection {
      flex: 1;
      background-color: #3b62b0;
      color: white;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      height: 48px;
      cursor: pointer;
    }

    .btn-back-round {
      width: 48px;
      height: 48px;
      border: 2px solid #3b62b0;
      border-radius: 50%;
      background: white;
      color: #3b62b0;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">

    <!-- LOGIN SCREEN -->
    <div id="loginView" class="view-screen">
      <div class="brand-section">
        <div class="brand-logo-icon">SPTS</div>
        <div class="brand-title">Equipment Portal</div>
        <div class="brand-subtitle">Sign in with your credentials</div>
      </div>

      <div id="errorMessage" class="alert-error hidden"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="usernameInput">USERNAME</label>
          <input type="text" id="usernameInput" class="form-input" placeholder="Enter Username" required autocomplete="off" />
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">PASSWORD</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="Enter Password" required />
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" style="margin-top: 20px;">
          <span id="btnText">Sign In</span>
        </button>
      </form>
    </div>

    <!-- MAIN HOME PAGE -->
    <div id="mainView" class="view-screen hidden">
      <div class="user-card">
        <div class="user-name" id="displayName">-</div>
        <div class="badge-group">
          <span class="badge" id="displayCompany">SPTS</span>
          <span class="badge badge-highlight" id="displayUserId">ID: -</span>
          <span class="badge" id="displayGroup">Group: -</span>
        </div>
      </div>

      <div style="font-size: 14px; font-weight: 700; color: #64748b; margin-bottom: 12px; text-transform: uppercase;">
        Available Modules
      </div>

      <div class="nav-card" onclick="openChecklist()">
        <div class="nav-card-icon">📋</div>
        <div>
          <div class="nav-card-title">Equipment Checklist</div>
          <div class="nav-card-sub">Perform daily equipment & PM inspection</div>
        </div>
      </div>

      <button onclick="handleLogout()" class="btn-primary" style="background-color: #64748b; margin-top: auto;">
        Sign Out
      </button>
    </div>

    <!-- CHECKLIST SCREEN -->
    <div id="checklistView" class="view-screen hidden">
      <div class="inspection-top-nav">
        <div class="btn-home-icon" onclick="closeChecklist()" title="Go to Home Page">🏠</div>
        <div class="inspection-header-title">EQUIPMENT INSPECTION</div>
      </div>

      <div class="banner-bar">
        <div class="banner-shift" id="shiftBanner">-- SHIFT</div>
        <div class="banner-date" id="liveDateTime">Date: --/--/---- --:-- hrs</div>
      </div>

      <div class="user-info-banner">
        <div id="inspCompany">-</div>
        <div id="inspOperator">-</div>
      </div>

      <!-- 1. Equipment Category -->
      <div class="form-group">
        <label class="form-label">Select Equipment</label>
        <input 
          type="text" 
          id="selectEquipment" 
          class="form-input" 
          placeholder="Type or select equipment..."
          autocomplete="off"
          oninput="onEquipmentInputChange(this.value)"
        />
        <div id="equipmentGrid" class="grid-container-eq"></div>
      </div>

      <!-- 2. Equipment Number -->
      <div class="form-group">
        <label class="form-label">Select Equipment Number</label>
        <input 
          type="text" 
          id="selectEquipmentNo" 
          class="form-input" 
          placeholder="Type or select number..."
          autocomplete="off"
          oninput="onEquipmentNoInputChange(this.value)"
        />
        <div id="equipmentNoGrid" class="grid-container-num"></div>
      </div>

      <!-- 3. Issue -->
      <div class="form-group">
        <label class="form-label">Select Issue</label>
        <input 
          type="text" 
          id="selectIssue" 
          class="form-input" 
          placeholder="Type or select issue..."
          autocomplete="off"
          oninput="onIssueInputChange(this.value)"
        />
        <div id="issueGrid" class="grid-container-list"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Declaration (last 12 hours)</label>
        <textarea id="declarationText" class="form-textarea" placeholder="- hrs -"></textarea>
      </div>

      <div class="action-row">
        <button id="sendBtn" class="btn-submit-inspection" onclick="sendChecklistData()">Submit</button>
        <div class="btn-back-round" onclick="closeChecklist()">➔</div>
      </div>
    </div>

  </div>

    };

    const REVERSE_LOOKUP = {};
    for (const [eqType, numList] of Object.entries(EQUIPMENT_DATABASE)) {
      numList.forEach(num => { REVERSE_LOOKUP[num.toUpperCase()] = eqType; });
    }

    const LOGIN_FLOW_URL = "https://default227dccee4218411f91e74dabddf0f5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/29ef85880a4c4deaa667684c428d530d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=MBH_x3BWausPompPfN0xNODkcPhbDVA7Bv3vGgFW2SY";
    const CHECKLIST_FLOW_URL = "https://default227dccee4218411f91e74dabddf0f5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/d7ac73d3d7d7423eb077a2895b0738df/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OLDn8ig2sbXDzxKke7ijuD4cLHTaQS-3v2oVkSIDrMw";

    let currentUser = null;

    function renderGridBoxes(containerId, items, selectedValue, onSelectCallback, isList = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      items.forEach(item => {
        const box = document.createElement('div');
        box.className = isList ? 'grid-box-list' : 'grid-box';
        box.innerText = item;
        
        if (item.toUpperCase() === selectedValue.toUpperCase()) {
          box.classList.add('selected');
        }

        box.onclick = () => { onSelectCallback(item); };
        container.appendChild(box);
      });
    }

    function refreshGrids() {
      const eqVal = document.getElementById('selectEquipment').value.trim();
      const numVal = document.getElementById('selectEquipmentNo').value.trim();
      const issueVal = document.getElementById('selectIssue').value.trim();

      const eqQuery = eqVal.toUpperCase();
      const eqFiltered = Object.keys(EQUIPMENT_DATABASE).filter(eq => eq.includes(eqQuery));
      renderGridBoxes('equipmentGrid', eqFiltered, eqVal, (selected) => {
        document.getElementById('selectEquipment').value = selected;
        document.getElementById('selectEquipmentNo').value = '';
        document.getElementById('selectIssue').value = '';
        refreshGrids();
      });

      const numQuery = numVal.toUpperCase();
      let numSource = eqVal && EQUIPMENT_DATABASE[eqVal.toUpperCase()] 
        ? EQUIPMENT_DATABASE[eqVal.toUpperCase()] 
        : Object.values(EQUIPMENT_DATABASE).flat();
      
      const numFiltered = numSource.filter(n => n.toUpperCase().includes(numQuery));
      renderGridBoxes('equipmentNoGrid', numFiltered, numVal, (selected) => {
        document.getElementById('selectEquipmentNo').value = selected;
        if (REVERSE_LOOKUP[selected.toUpperCase()]) {
          document.getElementById('selectEquipment').value = REVERSE_LOOKUP[selected.toUpperCase()];
        }
        refreshGrids();
      });

      const issueQuery = issueVal.toUpperCase();
      let issueSource = eqVal && ISSUE_DATABASE[eqVal.toUpperCase()] 
        ? ISSUE_DATABASE[eqVal.toUpperCase()] 
        : ["I've checked and declared all OK"];

      const issueFiltered = issueSource.filter(i => i.toUpperCase().includes(issueQuery));
      renderGridBoxes('issueGrid', issueFiltered, issueVal, (selected) => {
        document.getElementById('selectIssue').value = selected;
        refreshGrids();
      }, true);
    }

    function onEquipmentInputChange(val) { refreshGrids(); }

    function onEquipmentNoInputChange(val) {
      const num = val.trim().toUpperCase();
      if (REVERSE_LOOKUP[num]) {
        document.getElementById('selectEquipment').value = REVERSE_LOOKUP[num];
      }
      refreshGrids();
    }

    function onIssueInputChange(val) { refreshGrids(); }

    // AUTH / LOGIN HANDLER
    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('usernameInput').value.trim();
      const passwordInput = document.getElementById('passwordInput').value.trim();
      const errorBox = document.getElementById('errorMessage');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');

      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.innerText = 'Authenticating...';

      try {
        const response = await fetch(LOGIN_FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const result = await response.json();
        console.log("Login Flow Response Object:", result);

        if (response.ok && (result.status === 'success' || result.Title || result.COMPANY_ID || result.name)) {
          currentUser = result;
          sessionStorage.setItem('userSession', JSON.stringify(result));
          showHomeView();
        } else {
          showError(result.message || 'Invalid Username or Password.');
        }
      } catch (err) {
        showError('Network error. Unable to connect.');
      } finally {
        submitBtn.disabled = false;
        btnText.innerText = 'Sign In';
      }
    }

    // Helper: Finds a key inside an object regardless of uppercase/lowercase variations
    function getPropValue(obj, keys, defaultValue = 'N/A') {
      if (!obj) return defaultValue;
      for (const k of keys) {
        if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') {
          return obj[k];
        }
      }
      return defaultValue;
    }

    function showHomeView() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('checklistView').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');

      if (currentUser) {
        // Find Title / Full Name
        const nameOrTitle = getPropValue(currentUser, ['Title', 'title', 'name', 'NAME'], 'User');
        document.getElementById('displayName').innerText = nameOrTitle;
        
        // Find Company
        const companyVal = getPropValue(currentUser, ['Company', 'company', 'COMPANY'], 'SPTS');
        document.getElementById('displayCompany').innerText = companyVal;
        
        // Find COMPANY_ID (Badge Number)
        const userIdVal = getPropValue(currentUser, ['COMPANY_ID', 'company_id', 'Company_ID', 'ID', 'id', 'Username', 'username'], 'N/A');
        document.getElementById('displayUserId').innerText = `ID: ${userIdVal}`;
        
        // Find Group
        const groupVal = getPropValue(currentUser, ['Group', 'group', 'GROUP'], 'N/A');
        document.getElementById('displayGroup').innerText = `Group: ${groupVal}`;
      }
    }

    function openChecklist() {
      document.getElementById('mainView').classList.add('hidden');
      document.getElementById('checklistView').classList.remove('hidden');

      if (currentUser) {
        const nameOrTitle = getPropValue(currentUser, ['Title', 'title', 'name', 'NAME'], 'OPERATOR NAME');
        const companyVal = getPropValue(currentUser, ['Company', 'company', 'COMPANY'], 'SPTS SERVICES SDN BHD');
        document.getElementById('inspCompany').innerText = companyVal;
        document.getElementById('inspOperator').innerText = nameOrTitle;
      }

      updateLiveShiftAndDate();
      refreshGrids();
    }

    function closeChecklist() {
      document.getElementById('checklistView').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');
    }

    function handleLogout() {
      sessionStorage.removeItem('userSession');
      currentUser = null;
      document.getElementById('usernameInput').value = '';
      document.getElementById('passwordInput').value = '';
      document.getElementById('mainView').classList.add('hidden');
      document.getElementById('checklistView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorMessage');
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }

    function updateLiveShiftAndDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      
      document.getElementById('liveDateTime').innerText = `Date: ${dd}/${mm}/${yyyy} ${hh}:${min} hrs`;

      const totalMinutes = (now.getHours() * 60) + now.getMinutes();
      const shiftBanner = document.getElementById('shiftBanner');

      if (totalMinutes >= (8 * 60) && totalMinutes <= (20 * 60)) {
        shiftBanner.innerText = "DAY SHIFT";
        shiftBanner.className = "banner-shift shift-day";
      } else {
        shiftBanner.innerText = "NIGHT SHIFT";
        shiftBanner.className = "banner-shift shift-night";
      }
    }

    function getFormattedDateTime() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
    }

    async function sendChecklistData() {
      const equipment = document.getElementById('selectEquipment').value.trim();
      const equipmentNo = document.getElementById('selectEquipmentNo').value.trim();
      const issue = document.getElementById('selectIssue').value.trim();
      const declaration = document.getElementById('declarationText').value.trim();
      const shiftText = document.getElementById('shiftBanner').innerText;
      const sendBtn = document.getElementById('sendBtn');

      if (!equipment) {
        alert("Please select the Equipment.");
        return;
      }

      if (!equipmentNo) {
        alert("Please put the Equipment Number");
        return;
      }

      if (!issue) {
        alert("Please update the Equipment Condition");
        return;
      }

      const upperIssue = issue.toUpperCase();
      const isNilIssue = (
        upperIssue.includes("ALL OK") || 
        upperIssue.includes("NIL") || 
        issue === ""
      );

      // Extract Company ID & Title from current session using helper
      const userIdVal = getPropValue(currentUser, ['COMPANY_ID', 'company_id', 'Company_ID', 'ID', 'id', 'Username', 'username'], 'N/A');
      const nameTitleVal = getPropValue(currentUser, ['Title', 'title', 'name', 'NAME'], 'Unknown');
      const companyVal = getPropValue(currentUser, ['Company', 'company', 'COMPANY'], 'SPTS');
      const groupVal = getPropValue(currentUser, ['Group', 'group', 'GROUP'], 'N/A');

      const payload = {
        date: getFormattedDateTime(),                          // "2026-08-06 14:30:00"
        shift: shiftText,                                      // "DAY SHIFT"
        COMPANY_ID: String(userIdVal),                         // "T5218"
        Title: String(nameTitleVal),                           // "NOFIJUIDI BIN JUMRI"
        company: String(companyVal),                           // "SPTS"
        group: String(groupVal),                               // "B"
        equipment: String(equipment),                          // "PM"
        equipnum: String(equipmentNo),                         // "PM01"
        area: String(issue),                                   // "Aircond - Tidak Sejuk"
        declaration: String(declaration),
        isNewIssue: !isNilIssue                                // true / false
      };

      console.log("Submitting Payload to Power Automate:", payload);

      sendBtn.disabled = true;
      sendBtn.innerText = 'Submitting...';

      try {
        const response = await fetch(CHECKLIST_FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert('Inspection logged successfully!');
          
          document.getElementById('selectEquipment').value = '';
          document.getElementById('selectEquipmentNo').value = '';
          document.getElementById('selectIssue').value = '';
          document.getElementById('declarationText').value = '';
          
          closeChecklist();
        } else {
          alert('Failed to submit inspection log. Server returned an error.');
        }
      } catch (err) {
        alert('Network error. Failed to send data.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = 'Submit';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const activeSession = sessionStorage.getItem('userSession');
      if (activeSession) {
        currentUser = JSON.parse(activeSession);
        showHomeView();
      }
    });
  </script>
