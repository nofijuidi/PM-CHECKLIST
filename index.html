<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPTS - Home</title>
  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      
      /* Disable native text selection & contextual search pop-ups globally */
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .main-container {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .app-title {
      color: #002060;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
    }

    .btn-nav {
      width: 100%;
      padding: 14px;
      background-color: #0078D4;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }

    .btn-nav:active {
      background-color: #005a9e;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="main-container">
      <div class="app-title">SPTS OPERATIONS</div>
      <button class="btn-nav" onclick="window.location.href='modules/manpower-booking.html'">Open Module</button>
    </div>
  </div>

  <script>
    // Prevent context menu (long-press popups)
    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
